# Netlify: set the base directory to "site". Built files are committed, so there is no build step.
[build]
  publish = "."
  command = ""

# Shared code chunks have a hash in their name, so browsers may keep them for a year
[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
